name: Verify public song mirror
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download all packages and images anonymously
        run: python3 tools/verify_public.py
      - uses: actions/upload-artifact@v4
        with:
          name: anonymous-mirror-verification
          path: verification-report.json
